<div class="register-container">
  <div class="register-card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">Regístrate para empezar a añadir productos a tu carrito</p>

    <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name" 
          placeholder="Juan Pérez"
          [class.input-error]="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
        />
        <span *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid" class="error-text">
          El nombre es obligatorio (mínimo 3 caracteres)
        </span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
          [class.input-error]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        />
        <span *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['required']" class="error-text">
          El correo es obligatorio
        </span>
        <span *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']" class="error-text">
          Formato de correo inválido
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="******"
          [class.input-error]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        />
        <span *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="error-text">
          La contraseña debe tener mínimo 6 caracteres
        </span>
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-submit">
        Registrarme
      </button>
    </form>

    <p class="footer-text">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
