<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Ingresa a tu cuenta para gestionar tu carrito</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
          [class.input-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="error-text">
          El correo es obligatorio
        </span>
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" class="error-text">
          Formato de correo inválido
        </span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="******"
          [class.input-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-text">
          La contraseña es obligatoria (mínimo 6 caracteres)
        </span>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">
        Ingresar
      </button>
    </form>

    <p class="footer-text">
      ¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
